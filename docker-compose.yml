services:
  minecraft:
    build: .
    container_name: atm10-server
    env_file:
      - .env
    environment:
      ATM10_RESTART: "false"
    ports:
      - "25565:25565"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: bash -c 'echo > /dev/tcp/localhost/25565'
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3
